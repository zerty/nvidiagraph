version: '3.8'

services:
  nvidiagraph:
    build: .
    container_name: nvidiagraph
    ports:
      - "5000:5000"
    pid: host
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=nvidia-gpu-monitor-secret-key
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MONITOR_PASSWORD=  # Set a password to enable login authentication
      - MAX_HISTORY=600    # Maximum data points buffered per GPU (~10 min at 1 sample/s)
    restart: unless-stopped
    # Mount nvidia-smi from host if needed
    # volumes:
    #   - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    #   - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
